<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendly App</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .page {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .active {
            display: flex;
        }

        h1 {
            color: #4a4a4a;
            font-size: 2rem;
            margin-bottom: 2rem;
            padding: 0 20px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        .btn-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            position: relative;
            width: 100%;
            min-height: 150px;
        }

        button {
            background-color: #ffffff;
            color: #333;
            border: none;
            border-radius: 25px;
            padding: 15px 25px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            font-weight: bold;
            z-index: 10;
        }

        button:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            transform: translateY(-2px);
        }

        #btn-emo {
            transition: top 0.3s, left 0.3s, transform 0.3s;
        }
        
        #btn-matladatha {
            transition: transform 0.3s ease;
        }

    </style>
</head>
<body>

    <!-- Page 1 -->
    <div id="page1" class="page active">
        <h1>sorry! Please kavali ani cheyala</h1>
        <div class="btn-container">
            <button id="btn-istam" onclick="shrinkIstam()">ni istam ochindhi chesuko 😒</button>
            <button onclick="goToPage('page2')">sare le 😀</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div id="page2" class="page">
        <h1>Inka Mamulga matladuthav ga</h1>
        <div class="btn-container" id="page2-btn-container">
            <button id="btn-matladatha" onclick="goToPage('page3')">matladatha le 🙂</button>
            <button id="btn-emo" onclick="moveAndShrinkEmo()">Emo 🙄</button>
        </div>
    </div>

    <!-- Page 3 -->
    <div id="page3" class="page">
        <h1>Oka pic pettamante pettavu gaa 😒</h1>
        <div class="btn-container">
            <button onclick="goToPage('page4a')">pettanu Naa istam 😏</button>
            <button onclick="goToPage('page4b')">pedatha le tharuvatha 😄</button>
        </div>
    </div>

    <!-- Page 4a -->
    <div id="page4a" class="page">
        <h1>Sare le vodhiley 😔</h1>
    </div>

    <!-- Page 4b -->
    <div id="page4b" class="page">
        <h1>Nice 😀 waiting pic kosammm 😋</h1>
    </div>

    <script>
        // Variables for scaling
        let scaleIstam = 1.0;
        let scaleEmo = 1.0;
        let scaleMatladatha = 1.0;

        function goToPage(pageId) {
            // Hide all pages
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            // Show target page
            document.getElementById(pageId).classList.add('active');
        }

        function shrinkIstam() {
            scaleIstam *= 0.8; // Decreases by 0.8x every time
            document.getElementById('btn-istam').style.transform = `scale(${scaleIstam})`;
        }

        function moveAndShrinkEmo() {
            const btnEmo = document.getElementById('btn-emo');
            const btnMatladatha = document.getElementById('btn-matladatha');
            const container = document.getElementById('page2');
            
            // Decrease Emo by 0.4x (multiplier of 0.6)
            scaleEmo *= 0.6; 
            
            // Increase first option by 0.2x
            scaleMatladatha += 0.2;

            // Apply scales
            btnMatladatha.style.transform = `scale(${scaleMatladatha})`;
            btnEmo.style.transform = `scale(${scaleEmo})`;

            // Make Emo move randomly over the screen
            btnEmo.style.position = 'absolute';
            
            // Calculate random positions within the visible window area
            const maxLeft = container.clientWidth - btnEmo.clientWidth;
            const maxTop = container.clientHeight - btnEmo.clientHeight;
            
            const randomLeft = Math.floor(Math.random() * (maxLeft > 0 ? maxLeft : 300));
            const randomTop = Math.floor(Math.random() * (maxTop > 0 ? maxTop : 500));

            btnEmo.style.left = `${randomLeft}px`;
            btnEmo.style.top = `${randomTop}px`;
        }
    </script>

</body>
</html>
